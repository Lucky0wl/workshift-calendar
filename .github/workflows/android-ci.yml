name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'tools platform-tools platform;android-34 build-tools;34.0.0'

      - name: Install Gradle and generate wrapper
        run: |
          curl -sL -o gradle.zip https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle.zip
          chmod +x gradle-8.5/bin/gradle
          ./gradle-8.5/bin/gradle wrapper --gradle-version=8.5 --no-daemon
          rm -rf gradle-8.5 gradle.zip

      - name: Build debug APK
        run: |
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-$HOME/.android/sdk}"
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
