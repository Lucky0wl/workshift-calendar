name: Generate Keystore (Run Once)
# Run this workflow manually ONE TIME to generate a keystore.
# After it runs, copy the output Base64 value and add it as GitHub Secret KEYSTORE_BASE64.
# Then delete this workflow file.

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          keytool -genkey -v \
            -keystore workshift.jks \
            -alias workshift \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass workshift2024 \
            -keypass workshift2024 \
            -dname "CN=Workshift Calendar, OU=App, O=Lucky0wl, L=Russia, S=Russia, C=RU"

          echo "========== BASE64 KEYSTORE (copy this) =========="
          base64 -w 0 workshift.jks
          echo ""
          echo "=================================================="
          echo ""
          echo "Add this as GitHub Secret: KEYSTORE_BASE64"
          echo "Also add these secrets:"
          echo "  KEYSTORE_PASSWORD = workshift2024"
          echo "  KEY_ALIAS         = workshift"
          echo "  KEY_PASSWORD      = workshift2024"
